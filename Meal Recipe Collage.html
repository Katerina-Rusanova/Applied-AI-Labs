/* Layout: an overlapping desk of three masked screenshots on the product's own night-violet ground; stacks to one column on phones. Single dark look on purpose (matches the recipe card). */
:root {
  color-scheme: dark;
  --bg: #120d1c;
  --glow: #2a1f47;
  --fg: #ece8f5;
  --muted: #a49cb8;
  --accent: #8b6fe0;
  --edge: #3a2f55;
  --f-body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
body {
  background: radial-gradient(1200px 600px at 70% 10%, var(--glow), transparent 70%), var(--bg);
  background-color: var(--bg);
  color: var(--fg); font-family: var(--f-body); line-height: 1.5;
}
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 40px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 32px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.lead { margin: 8px 0 0; color: var(--muted); max-width: 56ch; }
.key { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.key i { width: 34px; height: 16px; border: 2px solid var(--accent); border-radius: 5px; background: repeating-linear-gradient(90deg, #3d3260 0 6px, #4a3d74 6px 12px); filter: blur(.3px); }

.desk { position: relative; aspect-ratio: 1 / .82; }
figure { margin: 0; position: absolute; min-width: 0; }
figure img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--edge); box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(139,111,224,.15); }
figcaption { position: absolute; left: 14px; bottom: 14px; max-width: calc(100% - 28px); background: rgba(18,13,28,.88); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; font-size: 13px; backdrop-filter: blur(6px); }
figcaption b { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
figcaption span { color: var(--muted); }

/* Positions in % of the desk: lens 72% wide (h .557W), forecast 24% (h .390W), runs 48% (h .306W); desk h .82W. */
.lens { left: 0; top: 0; width: 72%; z-index: 1; transform: rotate(-.6deg); }
.forecast { right: 1%; top: 4%; width: 24%; z-index: 2; transform: rotate(2.2deg); }
.forecast figcaption { left: 10px; right: 10px; bottom: 10px; max-width: none; }
.runs { right: 0; top: 61%; width: 48%; z-index: 3; transform: rotate(1deg); }
.lens figcaption { bottom: auto; top: 14px; left: auto; right: 14px; }
.mixture { left: 3%; top: 69%; width: 33%; z-index: 4; transform: rotate(-1.4deg); }
.mixture figcaption { bottom: auto; top: 14px; }

@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  figure { transition: transform .35s ease, z-index 0s; }
  figure:hover { transform: rotate(0) scale(1.015); z-index: 5; }
}
@media (max-width: 760px) {
  .desk { aspect-ratio: auto; display: grid; gap: 20px; }
  .lens, .forecast, .runs, .mixture { position: static; width: auto; transform: none; }
  .forecast { max-width: 260px; justify-self: center; }
  figcaption { position: static; margin-top: 8px; max-width: none; }
  .lens figcaption { position: static; }
}
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--edge); padding-top: 16px; }
body { margin: 0; }
img { max-width: 100%; }
</style>
</head>
